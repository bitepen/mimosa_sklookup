# ==========================================================
# Mimosa eBPF 透明代理配置文件
# ==========================================================

# Mihomo TPROXY / 透明代理监听端口
MIHOMO_PORT=7891

# 除 53 端口外的 UDP 流量处理模式：
#   capture : 捕获全端口 UDP 流量进入 Mihomo 核心（适合游戏/语音/原生 QUIC 代理）
#   bypass  : 不操作，仅劫持 UDP 53 (DNS)，其余 UDP 走物理网卡直连
#   block   : 直接拦截非 53 端口的 UDP 流量（迫使 QUIC 0ms 秒退回 TCP，省电且稳定）
UDP_MODE=block

# IPv6 流量处理模式：
#   capture : 捕获公网与 Fake-IPv6 流量进入 Mihomo 核心（需在 config.yaml 开启 ipv6: true）
#   bypass  : 不操作，所有 IPv6 流量走物理网卡原生直连
#   block   : 直接拦截公网 IPv6 (2000::/3)，防止真实 IP 泄露并秒退回 IPv4
IPV6_MODE=block

# 是否开启应用包名黑名单（true: 开启, false: 关闭）
# 开启后，下方 [black_list] 中的应用将直接走物理网卡，不拿 Fake-IP、不进 Mihomo 核心
BLACKLIST_ENABLE=true


# ==========================================================
# 绕过代理的应用包名黑名单（每行一个包名，支持 # 注释）
# ==========================================================
[black_list]

